<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="robots" content="noindex">

  <style>
    @font-face{font-family:"Geist";src:url(/assets/fonts/geist.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
    @font-face{font-family:"Geist Mono";src:url(/assets/fonts/geist-mono.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
    @font-face{font-family:"Instrument Serif";src:url(/assets/fonts/instrument-serif.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:"Instrument Serif";src:url(/assets/fonts/instrument-serif-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
    @font-face{font-family:"Geist Fallback";src:local("Arial");size-adjust:105.55%;ascent-override:95.21%;descent-override:27.95%;line-gap-override:0%}
    @font-face{font-family:"Geist Mono Fallback";src:local("Courier New");size-adjust:99.98%;ascent-override:100.52%;descent-override:29.5%;line-gap-override:0%}
    @font-face{font-family:"Instrument Serif Fallback";src:local("Times New Roman");size-adjust:84.32%;ascent-override:117.4%;descent-override:36.76%;line-gap-override:0%}
    @font-face{font-family:"Instrument Serif Fallback";src:local("Times New Roman Italic"),local("TimesNewRoman-Italic");font-style:italic;size-adjust:88.63%;ascent-override:111.7%;descent-override:34.98%;line-gap-override:0%}

    :root{
      color-scheme:dark;
      --bg:#0a0b0d;--bg-1:#0f1114;--line:#1b1f24;--line-2:#2a2f36;
      --text:#eceef0;--text-2:#a4aab3;--text-3:#7b828c;
      --accent:#00adf2;--accent-2:#52c8ff;--accent-ink:#00141f;
      --font-sans:"Geist","Geist Fallback",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --font-serif:"Instrument Serif","Instrument Serif Fallback","Times New Roman",serif;
      --font-mono:"Geist Mono","Geist Mono Fallback",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      --gutter:clamp(20px,4.5vw,56px);
      --ease:cubic-bezier(.2,.7,.2,1);
    }
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:400 1rem/1.6 var(--font-sans);font-synthesis:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
    h1,p{margin:0}
    a{color:inherit;text-decoration:none}
    img,svg{display:block;max-width:100%}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
    ::selection{background:var(--accent);color:var(--accent-ink)}
    .wrap{width:min(100% - 2*var(--gutter),1200px);margin-inline:auto}

    header .wrap{display:flex;align-items:center;height:64px}
    .brand{display:inline-flex;align-items:center;gap:12px;min-height:44px}
    .brand img{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 1px var(--line-2)}
    .brand span{font:600 1.0625rem/1 var(--font-mono);letter-spacing:.04em}

    main{flex:1;display:grid;align-items:center;padding-block:clamp(32px,8vh,96px)}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);column-gap:clamp(32px,6vw,96px);align-items:center}
    .code{display:flex;align-items:center;gap:14px;font:500 .75rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
    .code b{color:var(--accent);font-weight:500}
    .code::after{content:"";flex:0 1 96px;height:1px;background:var(--line-2)}
    h1{margin-top:clamp(20px,3vw,32px);font:400 clamp(3.5rem,2rem + 7vw,8rem)/.9 var(--font-serif);letter-spacing:-.025em;word-spacing:.04em;text-wrap:balance}
    h1 em{font-style:italic;color:var(--accent)}
    .lead{max-width:30em;margin-top:clamp(20px,3vw,32px);font-size:clamp(1.0625rem,.98rem + .4vw,1.3125rem);line-height:1.55;color:var(--text-2);text-wrap:pretty}
    .btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;margin-top:clamp(28px,4vw,40px);padding:0 22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:500 .9375rem/1 var(--font-sans);transition:background-color .2s var(--ease),transform .15s var(--ease)}
    .btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s var(--ease)}
    .btn:active{transform:translateY(1px) scale(.99)}
    @media (hover:hover){.btn:hover{background:var(--accent-2)} .btn:hover svg{transform:translateX(-2px)}}
    .art{justify-self:end;width:100%;max-width:300px}
    .art img{width:100%;height:auto}

    footer{border-top:1px solid var(--line);padding-block:24px 32px;font:500 .8125rem/1.5 var(--font-mono);color:var(--text-3)}

    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    .rise{animation:rise .8s var(--ease) both;animation-delay:var(--d,0ms)}
    @media (max-width:760px){
      .grid{grid-template-columns:1fr;row-gap:32px}
      .art{order:-1;justify-self:start;max-width:132px}
    }
    @media (prefers-reduced-motion:reduce){.rise{animation:none}.btn{transition:none}}
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/" aria-label="S4IL, home">
        <img src="/assets/img/s4il-icon.svg" width="32" height="32" alt="">
        <span>S4IL</span>
      </a>
    </div>
  </header>

  <main>
    <div class="wrap grid">
      <div>
        <p class="code rise"><b>404</b> Page not found</p>
        <h1 class="rise" style="--d:80ms">This page doesn&rsquo;t <em>exist.</em></h1>
        <p class="lead rise" style="--d:160ms">It may have moved, or I may have broken it. The home page, at least, is still standing.</p>
        <a class="btn rise" style="--d:240ms" href="/"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>Back home</a>
      </div>
      <div class="art rise" style="--d:120ms">
        <img src="/assets/img/s4il-sad.svg" width="300" height="291" alt="Cartoon S4IL looking sad, with a frown and a teal hoodie.">
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">© <span id="y">2026</span> S4IL · Code. Learn. Repeat.</div>
  </footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear()</script>
</body>
</html>
